name: Build Aurora iOS Beta IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "ios-port"
    tags:
      - "ios-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build first iOS beta IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select available Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild \
            -project AuroraFileManager.xcodeproj \
            -scheme AuroraFileManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AuroraFileManager.app"
          test -d "$APP_PATH"
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/
          cd package
          zip -qry ../AuroraFileManager-iOS-Beta-0.1-unsigned.ipa Payload

      - name: Upload beta IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-iOS-Beta-0.1-unsigned-IPA
          path: AuroraFileManager-iOS-Beta-0.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Aurora File Manager iOS Beta ${{ github.ref_name }}
          generate_release_notes: true
          files: AuroraFileManager-iOS-Beta-0.1-unsigned.ipa
